urdf:
  path: ./model/piper_with_gripper.urdf
  root_link: base_link
  model_name: piper_with_gripper

robot:
  id: piper_with_gripper
  display_name: "AgileX Piper with parallel gripper"
  family: manipulator
  root_part: arm
  exports:
    - provider_id: piper_health
      capabilities:
        - { path: robonix/primitive/health/state, description: "Read the current Piper demonstration health state." }
        - { path: robonix/primitive/health/stream, description: "Stream Piper demonstration health into Soma." }
    - provider_id: linux_health
      capabilities:
        - { path: robonix/primitive/health/state, description: "Read configured Linux host health." }
        - { path: robonix/primitive/health/stream, description: "Stream configured Linux host health into Soma." }
  components:
    - id: arm
      display_name: "Piper arm"
      type: arm
      urdf_link: base_link
      components:
        - id: joint_1
          display_name: "Joint 1"
          type: joint
          urdf_joint: joint1
          exports: []
        - id: joint_2
          display_name: "Joint 2"
          type: joint
          urdf_joint: joint2
          exports: []
        - id: joint_3
          display_name: "Joint 3"
          type: joint
          urdf_joint: joint3
          exports: []
        - id: joint_4
          display_name: "Joint 4"
          type: joint
          urdf_joint: joint4
          exports: []
        - id: joint_5
          display_name: "Joint 5"
          type: joint
          urdf_joint: joint5
          exports: []
        - id: joint_6
          display_name: "Joint 6"
          type: joint
          urdf_joint: joint6
          exports: []
        - id: gripper
          display_name: "Parallel gripper"
          type: gripper
          urdf_link: gripper_base
          exports: []
          components:
            - id: actuator
              display_name: "Gripper actuator"
              type: joint
              urdf_joint: gripper
              exports: []

    - id: compute_node
      display_name: "Linux compute node"
      type: computer
      exports: []
      components:
        - { id: cpu, display_name: "CPU", type: sensor, exports: [] }
        - { id: input_power, display_name: "INA238 input power", type: sensor, exports: [] }
        - { id: vdd_gpu, display_name: "VDD GPU", type: sensor, exports: [] }
        - { id: vdd_cpu_soc_mss, display_name: "VDD CPU/SOC/MSS", type: sensor, exports: [] }
        - { id: vin_sys_5v0, display_name: "VIN SYS 5V0", type: sensor, exports: [] }
        - { id: battery, display_name: "Host battery", type: battery, exports: [] }

description:
  summary: "A static Piper body with mock actuator health and real Linux compute-node telemetry."
  can_do:
    - "Render the official Piper visual model in the Robonix Client Vitals page."
    - "Show body, arm, joint, gripper, and compute-node health through Soma and Vitals."
    - "Read configured CPU temperature and power channels from Linux sysfs."
    - "Inject and recover selected joint or gripper faults for demonstrations."
  cannot_do:
    - "Move or simulate the arm."
    - "Control physical Piper hardware."
    - "Report real Piper actuator values; Piper health remains a controllable demonstration source."
  notes:
    - "Piper health is synthetic; Linux compute-node readings come from the deployment host."
    - "Executor and Pilot run so Vitals can monitor their software module health."
    - "Liaison and all other interaction, perception, audio, and simulation packages are intentionally absent."
