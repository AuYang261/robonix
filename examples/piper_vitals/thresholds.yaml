rules:
  - id: joint_motor_temperature
    selector: { kind: JOINT, signal: motor_temp }
    warn_above: 60.0
    error_above: 75.0
    unit: degC
  - id: joint_driver_temperature
    selector: { kind: JOINT, signal: driver_temp }
    warn_above: 70.0
    error_above: 85.0
    unit: degC
  - id: wheel_driver_temperature
    selector: { kind: WHEEL, signal: driver_temp }
    warn_above: 75.0
    error_above: 90.0
    unit: degC
  - id: sensor_temperature
    selector: { kind: SENSOR, signal: temperature }
    warn_above: 80.0
    error_above: 90.0
    unit: degC
  - id: sensor_voltage
    selector: { kind: SENSOR, signal: voltage }
    unit: V
  - id: sensor_current
    selector: { kind: SENSOR, signal: current }
    unit: A
  - id: battery_soc
    selector: { kind: BATTERY, signal: soc_percent }
    warn_below: 20.0
    error_below: 8.0
    unit: percent
  - id: battery_voltage
    selector: { kind: BATTERY, signal: voltage }
    warn_below: 22.0
    error_below: 19.0
    unit: V
  - id: battery_current
    selector: { kind: BATTERY, signal: current }
    unit: A
